# RouteLanka: `docker compose up` starts the whole stack with seed data.
# Put the competition datasets in ./data first (see README): they are never committed.
name: routelanka

x-env: &env
  DATABASE_URL: postgres://${POSTGRES_USER:-routelanka}:${POSTGRES_PASSWORD:-routelanka}@postgres:5432/${POSTGRES_DB:-routelanka}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-routelanka}:${RABBITMQ_PASSWORD:-routelanka}@rabbitmq:5672/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routelanka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routelanka}
      POSTGRES_DB: ${POSTGRES_DB:-routelanka}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-routelanka}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-routelanka}
    ports: ["${RABBITMQ_MANAGEMENT_PORT:-15672}:15672", "${RABBITMQ_PORT:-5672}:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # One-shot: apply migrations, then load the datasets and the demo delivery day.
  seed:
    build: { context: ., dockerfile: services/engine/Dockerfile }
    command: ["sh", "-c", "python -m routelanka_engine.migrate && python -m routelanka_engine.seed"]
    environment:
      <<: *env
      DATA_DIR: /data
      SEED_PASSWORD: ${SEED_PASSWORD:-routelanka}
    volumes: ["${DATA_DIR:-./data}:/data:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  engine:
    build: { context: ., dockerfile: services/engine/Dockerfile }
    environment: *env
    restart: unless-stopped
    depends_on:
      seed: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
