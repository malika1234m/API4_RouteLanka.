# RouteLanka: `docker compose up` starts the whole stack with seed data.
# Put the competition datasets in ./data first (see README): they are never committed.
name: routelanka

x-whatsapp: &whatsapp
  # off | simulator (the bundled Cloud API simulator, default) | cloud (Meta). See docs/whatsapp.md.
  WHATSAPP_MODE: ${WHATSAPP_MODE:-simulator}
  WHATSAPP_API_BASE: ${WHATSAPP_API_BASE:-http://wa-sim:3200}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-100000000000001}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-dev-wa-token}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-dev-wa-app-secret}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-wa-verify-token}
  WHATSAPP_LIVE_NUMBERS: ${WHATSAPP_LIVE_NUMBERS:-}
  # The business number stores send their JOIN message to (digits only, as people dial it).
  WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-94110000000}

x-env: &env
  DATABASE_URL: postgres://${POSTGRES_USER:-routelanka}:${POSTGRES_PASSWORD:-routelanka}@postgres:5432/${POSTGRES_DB:-routelanka}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-routelanka}:${RABBITMQ_PASSWORD:-routelanka}@rabbitmq:5672/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routelanka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routelanka}
      POSTGRES_DB: ${POSTGRES_DB:-routelanka}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-routelanka}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-routelanka}
    ports: ["${RABBITMQ_MANAGEMENT_PORT:-15672}:15672", "${RABBITMQ_PORT:-5672}:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # One-shot: apply migrations, then load the datasets and the demo delivery day.
  seed:
    # Same image as the engine (one build serves both).
    image: routelanka/engine:local
    build: { context: ., dockerfile: services/engine/Dockerfile }
    command: ["sh", "-c", "python -m routelanka_engine.migrate && python -m routelanka_engine.seed"]
    environment:
      <<: *env
      DATA_DIR: /data
      SEED_PASSWORD: ${SEED_PASSWORD:-routelanka}
      # 1 rebuilds the data from the datasets (wipes demo days); 0 keeps an existing install.
      SEED_FORCE: ${SEED_FORCE:-0}
    volumes: ["${DATA_DIR:-./data}:/data:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  engine:
    image: routelanka/engine:local
    build: { context: ., dockerfile: services/engine/Dockerfile }
    environment: *env
    restart: unless-stopped
    depends_on:
      seed: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  notifier:
    build: { context: ., dockerfile: services/notifier/Dockerfile }
    environment:
      <<: [*env, *whatsapp]
    restart: unless-stopped
    depends_on:
      seed: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: [*env, *whatsapp]
      PORT: "4000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me-in-production-please}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-dev-sms-token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Local `docker compose up` runs with the example secrets; a real deployment sets its own.
      ALLOW_DEV_SECRETS: ${ALLOW_DEV_SECRETS:-true}
    ports: ["${API_PORT:-4000}:4000"]
    restart: unless-stopped
    depends_on:
      seed: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  # WhatsApp Cloud API simulator: stores' phones in the browser at /wa-sim (see docs/whatsapp.md).
  wa-sim:
    build: { context: ., dockerfile: services/wa-sim/Dockerfile }
    environment:
      WA_SIM_TOKEN: ${WHATSAPP_TOKEN:-dev-wa-token}
      WA_SIM_APP_SECRET: ${WHATSAPP_APP_SECRET:-dev-wa-app-secret}
      WA_SIM_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-100000000000001}
      WA_SIM_WEBHOOK_URL: http://api:4000/api/whatsapp/webhook
    ports: ["${WA_SIM_PORT:-3200}:3200"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000", WA_SIM_URL: "http://wa-sim:3200" }
    ports: ["${WEB_PORT:-3000}:3000"]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
